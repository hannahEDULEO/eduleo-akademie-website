<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Stundenübersicht – EDULEO intern</title>
  <link rel="icon" href="/favicon-32x32.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: #EDE6E2;
      min-height: 100vh;
      padding: 24px 16px 48px;
      color: #261D18;
    }

    .header {
      max-width: 900px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left img { height: 32px; }
    .header-left h1 { font-size: 20px; font-weight: 800; }
    .header-left span { font-size: 12px; color: #C4A092; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .refresh-btn {
      background: #5A9E7A;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #4a8a6a; }

    /* Stats row */
    .stats {
      max-width: 900px;
      margin: 0 auto 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 1px 8px rgba(38,29,24,.06);
    }
    .stat-card .val { font-size: 26px; font-weight: 900; color: #5A9E7A; }
    .stat-card .lbl { font-size: 11px; color: #888; margin-top: 2px; font-weight: 700; text-transform: uppercase; }
    .stat-card.warn .val { color: #e07000; }
    .stat-card.ok .val { color: #5A9E7A; }

    /* Auswertung / Diagramm */
    .auswertung {
      max-width: 900px;
      margin: 0 auto 20px;
      background: #fff;
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 1px 8px rgba(38,29,24,.06);
      display: none;
    }
    .ausw-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .ausw-head h2 { font-size: 15px; font-weight: 800; color: #261D18; }
    .ausw-total { font-size: 13px; font-weight: 800; color: #5A9E7A; }
    .ausw-bars { display: flex; flex-direction: column; gap: 14px; }
    .ausw-row { display: flex; flex-direction: column; gap: 5px; }
    .ausw-label { font-size: 13px; font-weight: 700; color: #261D18; line-height: 1.3; }
    .ausw-barline { display: flex; align-items: center; gap: 12px; }
    .ausw-track { flex: 1; background: #EDE6E2; border-radius: 8px; height: 16px; overflow: hidden; }
    .ausw-fill { display: block; height: 100%; background: #5A9E7A; border-radius: 8px; transition: width .4s; }
    .ausw-val { font-size: 12px; font-weight: 700; color: #666; text-align: right; white-space: nowrap; min-width: 88px; }
    @media (max-width: 600px) {
      .ausw-label { font-size: 12px; }
      .ausw-val { font-size: 11px; min-width: 74px; }
    }

    /* Entries */
    .entries { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    .entry-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(38,29,24,.06);
    }
    .entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1.5px solid #f0ecea;
      gap: 12px;
    }
    .entry-head:hover { background: #faf8f7; }
    .entry-head-left { display: flex; align-items: center; gap: 14px; }
    .kw-badge {
      background: #D2EADA;
      color: #5A9E7A;
      font-size: 13px;
      font-weight: 900;
      border-radius: 8px;
      padding: 4px 10px;
      white-space: nowrap;
    }
    .entry-head-meta { font-size: 13px; color: #888; }
    .entry-head-meta strong { color: #261D18; }
    .stunden-badge {
      font-size: 20px;
      font-weight: 900;
      color: #5A9E7A;
      white-space: nowrap;
    }
    .stunden-badge.low { color: #e07000; }
    .chevron { font-size: 14px; color: #ccc; transition: transform .2s; }
    .chevron.open { transform: rotate(180deg); }

    .entry-body { display: none; padding: 0 20px 16px; }
    .entry-body.open { display: block; }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: #C4A092;
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 6px 8px;
      border-bottom: 1.5px solid #f0ecea;
    }
    td { padding: 8px; border-bottom: 1px solid #f7f5f4; color: #444; }
    tr:last-child td { border-bottom: none; }
    .kat-badge {
      background: #EDE6E2;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #C4A092;
      white-space: nowrap;
    }
    .notiz-box {
      background: #FDF8F5;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      border-left: 3px solid #C4A092;
    }
    .notiz-box strong { color: #C4A092; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 4px; }

    .abw-box {
      background: #F3F7FF;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 13px;
      color: #555;
      border-left: 3px solid #7BA7D9;
    }
    .abw-box strong { color: #5985c0; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .abw-item {
      display: inline-block;
      background: #fff;
      border-radius: 6px;
      padding: 3px 9px;
      margin: 2px 4px 2px 0;
      font-weight: 700;
      font-size: 12px;
      color: #444;
    }
    .abw-badge {
      background: #EAF1FB;
      color: #5985c0;
      font-size: 12px;
      font-weight: 800;
      border-radius: 8px;
      padding: 4px 9px;
      white-space: nowrap;
    }

    .person-badge {
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      border-radius: 8px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    .load-badge {
      background: #F5F1EF;
      color: #555;
      font-size: 12px;
      font-weight: 800;
      border-radius: 8px;
      padding: 4px 9px;
      white-space: nowrap;
    }

    .bericht-text {
      white-space: pre-wrap;
      font-size: 14px;
      color: #444;
      line-height: 1.55;
      padding: 12px 2px 4px;
    }

    .del-btn {
      margin-left: 12px;
      background: none;
      border: none;
      color: #c99;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .del-btn:hover { color: #e66; }

    .datum-klein { font-size: 11px; color: #bbb; margin-top: 12px; text-align: right; }

    .empty { text-align: center; padding: 48px; color: #aaa; font-size: 15px; }

    .loading { text-align: center; padding: 48px; color: #888; }

    .filter-row {
      max-width: 900px;
      margin: 0 auto 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-row select, .filter-row input {
      padding: 8px 12px;
      border: 1.5px solid #D2EADA;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: #261D18;
    }

    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div id="pwgate" style="position:fixed;inset:0;z-index:99999;background:#EDE6E2;display:flex;align-items:center;justify-content:center;padding:20px;">
    <form id="pwform" style="background:#fff;border-radius:18px;padding:34px 30px;box-shadow:0 4px 24px rgba(38,29,24,.12);max-width:340px;width:100%;text-align:center;font-family:'Nunito',system-ui,sans-serif;">
      <div style="font-size:2rem;margin-bottom:10px;">🔒</div>
      <h1 style="font-size:1.15rem;color:#261D18;margin-bottom:6px;">Interner Bereich</h1>
      <p style="font-size:.85rem;color:#8a7d75;margin-bottom:18px;">Bitte gib das Team-Passwort ein.</p>
      <input type="password" id="pwinput" placeholder="Passwort" autocomplete="current-password" style="width:100%;padding:12px 14px;border:1.5px solid #d9cfc8;border-radius:10px;font-size:1rem;margin-bottom:10px;font-family:inherit;">
      <div id="pwerror" style="display:none;color:#c0392b;font-size:.82rem;margin-bottom:10px;">Falsches Passwort.</div>
      <button type="submit" style="width:100%;padding:12px;background:#5A9E7A;color:#fff;border:none;border-radius:100px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;">Anmelden</button>
    </form>
  </div>

  <div class="header">
    <div class="header-left">
      <img src="/Logo Akademie.png" alt="EDULEO">
      <div>
        <h1>Wochenberichte</h1>
        <span>EDULEO Team · Intern</span>
      </div>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ Aktualisieren</button>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="val" id="s-eintraege">–</div><div class="lbl">Berichte gesamt</div></div>
    <div class="stat-card"><div class="val" id="s-schnitt">–</div><div class="lbl">Ø Std./Woche</div></div>
    <div class="stat-card"><div class="val" id="s-letzte">–</div><div class="lbl">Letzter Bericht</div></div>
    <div class="stat-card"><div class="val" id="s-monat">–</div><div class="lbl">Std. lfd. Monat</div></div>
  </div>

  <div class="filter-row">
    <select id="filterPerson" onchange="render()">
      <option value="">Alle Personen</option>
      <option value="Calvin">Calvin</option>
      <option value="Hannah">Hannah</option>
      <option value="Janine">Janine</option>
    </select>
    <select id="filterMonat" onchange="render()">
      <option value="">Alle Monate</option>
    </select>
    <input type="text" id="filterSuche" placeholder="Suche..." oninput="render()" style="flex:1; min-width:150px;">
  </div>

  <div class="auswertung" id="auswertung"></div>

  <div class="entries" id="entries">
    <div class="loading">Daten werden geladen…</div>
  </div>

  <script>
    let allData = [];
    const PERSON_COLOR = { Hannah: '#9B5DA6', Janine: '#D98E2B', Calvin: '#5A9E7A' };
    const personOf = e => (e.person && PERSON_COLOR[e.person]) ? e.person : 'Calvin';
    const hasHours = e => personOf(e) === 'Calvin';

    async function loadData() {
      try {
        const res = await fetch('/api/stunden-abrufen');
        const json = await res.json();
        allData = json.eintraege || [];
        buildFilters();
        updateStats();
        render();
      } catch {
        document.getElementById('entries').innerHTML =
          '<div class="empty">Fehler beim Laden. Bitte Seite neu laden.</div>';
      }
    }

    function buildFilters() {
      const monate = new Set();
      allData.forEach(e => {
        if (e.eingereicht) {
          const d = new Date(e.eingereicht);
          monate.add(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
        }
      });
      const sel = document.getElementById('filterMonat');
      const cur = sel.value;
      sel.innerHTML = '<option value="">Alle Monate</option>';
      [...monate].sort().reverse().forEach(m => {
        const [y, mo] = m.split('-');
        const label = new Date(y, mo-1).toLocaleDateString('de', { month:'long', year:'numeric' });
        sel.innerHTML += `<option value="${m}" ${m===cur?'selected':''}>${label}</option>`;
      });
    }

    function updateStats() {
      const n = allData.length;
      document.getElementById('s-eintraege').textContent = n;
      if (n === 0) return;

      // Stunden-Kennzahlen nur über Calvin-Berichte (nur er erfasst Stunden)
      const calvin = allData.filter(hasHours);
      const avg = calvin.length
        ? calvin.reduce((s,e) => s + (e.gesamt||0), 0) / calvin.length : 0;
      document.getElementById('s-schnitt').textContent = avg.toFixed(1);

      const last = new Date(allData[0].eingereicht);
      document.getElementById('s-letzte').textContent = last.toLocaleDateString('de',{day:'2-digit',month:'2-digit'});

      const now = new Date();
      const monatStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
      const monatStd = calvin
        .filter(e => e.eingereicht && e.eingereicht.startsWith(monatStr))
        .reduce((s,e) => s + (e.gesamt||0), 0);
      document.getElementById('s-monat').textContent = monatStd;
    }

    // Auswertung: Stunden pro Kategorie über die aktuell gefilterten Berichte.
    // Hat eine Aufgabe mehrere Kategorien, werden die Stunden gleichmäßig aufgeteilt.
    function renderAuswertung(filtered) {
      const box = document.getElementById('auswertung');
      const map = {};
      let total = 0;
      filtered.forEach(e => {
        (e.eintraege || []).forEach(r => {
          const std = parseFloat(r.stunden);
          if (!std || std <= 0) return;
          let kats = (r.kategorien && r.kategorien.length)
            ? r.kategorien
            : (r.kategorie ? String(r.kategorie).split(',').map(s => s.trim()).filter(Boolean) : []);
          if (!kats.length) kats = ['Ohne Kategorie'];
          const share = std / kats.length;
          kats.forEach(k => { map[k] = (map[k] || 0) + share; });
          total += std;
        });
      });
      const rows = Object.keys(map).map(k => ({ k, v: map[k] })).sort((a, b) => b.v - a.v);
      if (!rows.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
      const max = rows[0].v;
      const fmt = n => Math.round(n * 100) / 100;
      box.style.display = 'block';
      box.innerHTML =
        '<div class="ausw-head"><h2>Auswertung: Wofür geht die Zeit drauf?</h2>' +
        '<span class="ausw-total">' + fmt(total) + ' h gesamt</span></div>' +
        '<div class="ausw-bars">' + rows.map(r => {
          const pct = total ? Math.round(r.v / total * 100) : 0;
          const w = max ? (r.v / max * 100) : 0;
          return '<div class="ausw-row">' +
            '<span class="ausw-label">' + r.k + '</span>' +
            '<span class="ausw-barline">' +
              '<span class="ausw-track"><span class="ausw-fill" style="width:' + w + '%"></span></span>' +
              '<span class="ausw-val">' + fmt(r.v) + ' h · ' + pct + '%</span>' +
            '</span>' +
            '</div>';
        }).join('') + '</div>';
    }

    function render() {
      const monat = document.getElementById('filterMonat').value;
      const person = document.getElementById('filterPerson').value;
      const suche = document.getElementById('filterSuche').value.toLowerCase();

      let filtered = allData.filter(e => {
        if (monat && e.eingereicht && !e.eingereicht.startsWith(monat)) return false;
        if (person && personOf(e) !== person) return false;
        if (suche) {
          const text = JSON.stringify(e).toLowerCase();
          if (!text.includes(suche)) return false;
        }
        return true;
      });

      renderAuswertung(filtered);

      const container = document.getElementById('entries');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">Noch keine Berichte vorhanden.</div>';
        return;
      }

      container.innerHTML = filtered.map((e, i) => {
        const p = personOf(e);
        // Stunden pro Aufgabe: für alle, die Stunden erfasst haben (Calvin, Hannah, Janine)
        const zeigtStunden = (e.eintraege || []).some(r => r.stunden !== null && r.stunden !== undefined);
        // Gesamtstunden-/40h-Kennzahl nur bei Calvin (Hannah/Janine ohne Gesamtstundenzahl)
        const hatGesamt = hasHours(e);
        const isLow = hatGesamt && (e.gesamt || 0) < 30;
        const kw = e.kw ? `KW ${e.kw}` : '–';
        const zeitraum = e.zeitraum || '';
        const eingereicht = e.eingereicht
          ? new Date(e.eingereicht).toLocaleDateString('de', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
          : '';

        const isText = !!(e.bericht_text && e.bericht_text.trim());
        const rows = (e.eintraege || []).map(r => {
          const auf = (r.tag ? r.tag + ': ' : '') + (r.aufgabe || '');
          const std = zeigtStunden
            ? `<td style="font-weight:700;text-align:right;">${r.stunden ?? 0} h</td>` : '';
          return `<tr>
            <td>${auf}</td>
            <td><span class="kat-badge">${r.kategorie || '–'}</span></td>
            <td>${r.notiz || ''}</td>
            ${std}
          </tr>`;
        }).join('');

        const abw = e.abwesenheiten || [];
        const abwIcon = s => s === 'Urlaub' ? '🌴' : s === 'Krank' ? '🤒' : s === 'Feiertag' ? '📅' : '•';
        const abwBadge = abw.length
          ? `<span class="abw-badge">${abwIcon(abw[0].status)} ${abw.length} Abw.</span>` : '';
        const abwBox = abw.length
          ? `<div class="abw-box"><strong>Abwesenheit</strong>${abw.map(a =>
              `<span class="abw-item">${abwIcon(a.status)} ${a.tag}: ${a.status}${a.notiz ? ' (' + a.notiz + ')' : ''}</span>`
            ).join('')}</div>` : '';

        const loadIcon = { 'ruhig': '🟢', 'normal': '🟡', 'voll': '🟠', 'am Limit': '🔴' };
        const loadBadge = e.auslastung
          ? `<span class="load-badge">${loadIcon[e.auslastung] || ''} ${e.auslastung}</span>` : '';
        const gepraegtBox = e.gepraegt
          ? `<div class="notiz-box"><strong>Diese Woche geprägt</strong>${e.gepraegt}</div>` : '';

        const notizBox = e.notizen
          ? `<div class="notiz-box"><strong>Notiz</strong>${e.notizen}</div>` : '';

        const stundenBadge = hatGesamt
          ? `<span class="stunden-badge ${isLow?'low':''}">${e.gesamt ?? 0} h</span>` : '';
        const stdHead = zeigtStunden ? '<th style="text-align:right">Std.</th>' : '';

        const bodyContent = isText
          ? `<div class="bericht-text">${e.bericht_text}</div>`
          : `<table>
                <thead><tr><th>Tätigkeit</th><th>Kategorie</th><th>Notiz</th>${stdHead}</tr></thead>
                <tbody>${rows}</tbody>
              </table>`;

        return `
          <div class="entry-card">
            <div class="entry-head" onclick="toggle(${i})">
              <div class="entry-head-left">
                <span class="person-badge" style="background:${PERSON_COLOR[p]}">${p}</span>
                <span class="kw-badge">${kw}</span>
                <div class="entry-head-meta">
                  <strong>${zeitraum}</strong>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:12px;">
                ${loadBadge}
                ${abwBadge}
                ${stundenBadge}
                <span class="chevron" id="chev-${i}">▾</span>
              </div>
            </div>
            <div class="entry-body" id="body-${i}">
              ${bodyContent}
              ${gepraegtBox}
              ${abwBox}
              ${notizBox}
              <div class="datum-klein">Eingereicht: ${eingereicht}${e._key ? ` <button class="del-btn" onclick="loeschen('${e._key}')" title="Bericht löschen">🗑 Löschen</button>` : ''}</div>
            </div>
          </div>`;
      }).join('');
    }

    async function loeschen(key) {
      if (!key) return;
      if (!confirm('Diesen Bericht wirklich löschen?')) return;
      if (!confirm('Bist du ganz sicher? Das Löschen kann nicht rückgängig gemacht werden.')) return;
      try {
        await fetch('/api/stunden-loeschen', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key })
        });
        await loadData();
      } catch {}
    }

    function toggle(i) {
      const body = document.getElementById('body-' + i);
      const chev = document.getElementById('chev-' + i);
      body.classList.toggle('open');
      chev.classList.toggle('open');
    }

    // ── Passwortschutz (interner Bereich) ──
    (function gate(){
      var PW = 'G-Klasse123';
      var ov = document.getElementById('pwgate');
      if (localStorage.getItem('eduleo_intern_ok') === '1') { if (ov) ov.remove(); loadData(); return; }
      var f = document.getElementById('pwform');
      var inp = document.getElementById('pwinput');
      var errEl = document.getElementById('pwerror');
      if (inp) inp.focus();
      f.addEventListener('submit', function(e){
        e.preventDefault();
        if (inp.value === PW) {
          localStorage.setItem('eduleo_intern_ok', '1');
          if (ov) ov.remove();
          loadData();
        } else {
          errEl.style.display = 'block';
          inp.value = '';
          inp.focus();
        }
      });
    })();
  </script>
</body>
</html>
